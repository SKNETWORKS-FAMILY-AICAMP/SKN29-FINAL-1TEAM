name: skn-settlement

# 로컬 개발용 docker-compose.
# 아키텍처(기술명세서 §1.2, §10):
#   React SPA ─► Nginx ─► Django(DRF, SoR) ─► FastAPI(AI Orchestrator + FastMCP + ML)
#   Postgres(확정 데이터 SoT) / Chroma(벡터 RAG)
#   ※ FastAPI(ai)는 내부 전용 — 사용자 트래픽은 Django만 받는다.

services:
  # ── PostgreSQL : 모든 확정 데이터의 SoT ─────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settlement}
      POSTGRES_USER: ${POSTGRES_USER:-settlement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settlement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settlement}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Chroma : 규정/사례 임베딩 벡터 스토어(RAG) ──────────────────
  chroma:
    image: chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/data
    ports:
      - "8001:8000"   # host 8001 → chroma 8000

  # ── Django + DRF : Core Backend (SoR, 상태머신, RBAC) ──────────
  core:
    build: ./apps/core
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-settlement}
      POSTGRES_USER: ${POSTGRES_USER:-settlement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settlement}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AI_BASE_URL: http://ai:9000
      # ai(FastAPI)가 core에 쓰기를 할 때 쓰는 **단일 서비스 계정**(Agent별로 나누지 않는다).
      # `manage.py ensure_service_account`(및 seed)가 이 값으로 비밀번호를 설정하고,
      # ai가 같은 값으로 JWT를 받는다 — **양쪽이 반드시 같아야 한다.**
      AI_SERVICE_USER: ${AI_SERVICE_USER:-${RULE_AGENT_SERVICE_USER:-rule-agent}}
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:-${RULE_AGENT_SERVICE_PASSWORD:-}}
      # 로그 파일 위치. 비우면 콘솔만 — 아래 ./logs 바인드로 호스트에서 바로 열린다.
      LOG_DIR: /logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/core:/app
      - media:/app/media
      # 컨테이너 로그를 호스트에서 그대로 열어보기 위한 바인드. core는 `logs/core.log`에 쓴다.
      - ./logs:/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI : AI Orchestrator + FastMCP + ML(이상탐지) ─────────
  #    내부 전용. Nginx로 노출하지 않는다(9000은 디버깅용 직접 노출).
  ai:
    build: ./apps/ai
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
    environment:
      CORE_BASE_URL: http://core:8000
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # core에 쓰기(룰 DRAFT 저장·적재 결과 회신)를 할 때 쓰는 서비스 계정. **core와 같은 값.**
      AI_SERVICE_USER: ${AI_SERVICE_USER:-${RULE_AGENT_SERVICE_USER:-rule-agent}}
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:-${RULE_AGENT_SERVICE_PASSWORD:-}}
      RULE_AGENT_MODEL: ${RULE_AGENT_MODEL:-gpt-4o-mini}
      RULE_AGENT_MODEL_HEAVY: ${RULE_AGENT_MODEL_HEAVY:-gpt-5-mini}
      RULE_AGENT_MODEL_HEAVY_REASONING_EFFORT: ${RULE_AGENT_MODEL_HEAVY_REASONING_EFFORT:-low}
      LOG_DIR: /logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 업로드된 규정 PDF를 읽을 위치(아래 media 볼륨). docling이 파일 경로를 요구해서
      # 바이트를 HTTP로 되넘기는 대신 core와 같은 볼륨을 공유한다.
      RAG_MEDIA_ROOT: /data/media
      # 비전 판독(영수증·증빙 문서). 페이지 수만큼 이미지 토큰이 붙으므로 상한을 둔다.
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_MAX_PAGES: ${VISION_MAX_PAGES:-8}
      # 개발용: docling 파싱만 미리 떠둔 덤프로 대체한다(아래 docling_eval 마운트).
      # 켜면 업로드 **파일 내용이 무시되고 문서명으로만** 덤프를 고른다 — 운영에선 절대 켜지 말 것.
      # 기본값 비어 있음 = 꺼짐. 켤 때는 .env에 DOCLING_MOCK=1.
      DOCLING_MOCK: ${DOCLING_MOCK:-}
      DOCLING_MOCK_DUMP: ${DOCLING_MOCK_DUMP:-/data/docling_eval/output}
    volumes:
      - ./apps/ai:/app
      # RAG 인덱싱 배치의 입력(파싱 덤프). 레포 루트에 있어 `/app` 마운트로는 안 보인다 —
      # 컨테이너는 읽기만 하므로 :ro. 사용: `--dump /data/docling_eval/output`
      - ./docling_eval:/data/docling_eval:ro
      # core가 저장한 업로드 원본(규정 PDF). ai는 읽기만 한다 — 파일의 SoR은 Django다.
      - media:/data/media:ro
      # 컨테이너 로그를 호스트에서 그대로 열어보기 위한 바인드. ai는 `logs/ai.log`에 쓴다.
      - ./logs:/logs
    ports:
      - "9000:9000"
    depends_on:
      - chroma

  # ── React SPA (Vite dev server) ────────────────────────────────
  web:
    build: ./apps/web
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}  # true를 명시한 경우만 목 데이터 사용
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - core

  # ── Nginx : 통합 리버스 프록시(prod-like 진입점) ────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - core
      - web

volumes:
  pgdata:
  chromadata:
  media:
