name: Build & Push Images

# 수동 실행 전용(aws-deployment-plan-v1.md §1-5) — main push로 자동 실행되지 않는다.
# main이 하루 여러 번 병합되는 중이라, 자동으로 빌드·배포되면 미완성 상태가
# 데모 서버에 올라갈 수 있다. Actions 탭에서 팀이 준비됐을 때 직접 실행한다.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            context: ./apps/core
            dockerfile: ./apps/core/Dockerfile
          - name: ai
            context: ./apps/ai
            dockerfile: ./apps/ai/Dockerfile
          - name: web
            context: .
            dockerfile: ./infra/nginx/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름은 소문자여야 해서 owner/repo를 변환
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 빌드 & push (${{ matrix.name }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repo }}-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
