# 운영용 nginx 설정 (infra/nginx/nginx.conf의 배포 버전).
#   /        → 빌드된 SPA 정적 파일 직접 서빙 (React Router 새로고침 대응: try_files)
#   /api/    → core:8000 (Django)  ※ 사용자 트래픽은 core만 받는다
#   /admin/  → core:8000 (Django admin)
#   /static/ → Django collectstatic 산출물 (core·nginx가 공유하는 named volume)
# ai(FastAPI)는 내부 전용이므로 여기서 프록시하지 않는다 — 원래도 없었고 그대로 유지.

server {
    listen 80;
    server_name _;

    location /api/ {
        # 규정 문서(PDF) 업로드가 여기로 온다. nginx 기본 1MB로는 곧바로 413에 걸린다.
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_pass http://core:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/admin/ {
        proxy_pass http://core:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
