# 통합 리버스 프록시 (기술명세서 §10).
#   /     → React SPA (Vite dev server)
#   /api/ → Django(DRF)  ※ 사용자 트래픽은 Django만 받는다
#   FastAPI(ai)는 내부 전용이므로 여기서 프록시하지 않는다.

server {
    listen 80;
    server_name localhost;

    # Core API (Django)
    location /api/ {
        # 규정 문서(PDF) 업로드가 여기로 온다. nginx 기본 1MB로는 규정 PDF가 곧바로
        # 413에 걸린다(사내 규정 4종이 이미 0.6~0.8MB, 고객 문서는 더 크다).
        client_max_body_size 50m;
        # 적재 요청은 즉시 202로 돌아오지만, 업로드 자체가 큰 파일이면 시간이 걸린다.
        proxy_read_timeout 120s;
        proxy_pass http://core:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin / static (개발 편의)
    location ~ ^/(admin|static)/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
    }

    # SPA + Vite HMR(websocket)
    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
